# Runtime and peak memory: full benchmark plus development forwards, one GPU.
model: olmoe
benchmarks: [mmlu, arc]
prompt: plain
workload: runs/olmoe/workload
responses: runs/olmoe/nvidia/responses
precision: bf16
output: runs/olmoe/amd/bf16/cost.json
# Execution mode; use the same one on both GPUs. The paper used prefix for Jais
# (independent no-cache forward per prefix) and teacher_forced for the others.
mode: teacher_forced
