# Greedy responses. Run on the reference GPU for all splits; on the target GPU
# use --set splits=[development] --set output=runs/qwenmoe/amd/bf16/responses (add
# --set precision=... for other precisions) to measure whole-response agreement.
model: qwenmoe
workload: runs/qwenmoe/workload
splits: [train, development]
output: runs/qwenmoe/nvidia/responses
max_new_tokens: 1024
precision: bf16
# Execution mode; use the same one on both GPUs. The paper used prefix for Jais
# (independent no-cache forward per prefix) and teacher_forced for the others.
mode: teacher_forced
