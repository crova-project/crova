# Output-head LoRA on the target GPU, trained towards the reference logits.
# profile: equal, numerical, mse, kl, token, top5, decision or kl_only.
model: llama
workload: runs/llama/workload
reference: runs/llama/nvidia/logits
output: runs/llama/lora/equal
profile: equal
epochs: 2
max_positions: 128   # positions per training response (null = all)
rank: 32
alpha: 64
lr: 1.0e-4
wandb: false
